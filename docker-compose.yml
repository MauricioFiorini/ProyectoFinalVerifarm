# PostgreSQL local para desarrollo.
#
# Se levanta con `docker compose up -d` y se apaga con `docker compose down`.
# Los datos viven en el volumen `verifarm-datos`, asi que sobreviven a
# `down` y a reiniciar la maquina. Para borrar la base y empezar de cero:
# `docker compose down -v`.
#
# Las credenciales estan escritas aca a proposito: son de desarrollo local,
# la base solo escucha en localhost y los datos del proyecto son sinteticos.
# Tienen que coincidir con la DATABASE_URL de tu `.env` (ver `.env.example`).

services:
  db:
    image: postgres:16
    container_name: verifarm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: verifarm
      POSTGRES_PASSWORD: verifarm
      POSTGRES_DB: verifarm
    ports:
      # host:contenedor.
      #
      # El 5433 del lado del host no es un capricho. PostgreSQL usa el 5432 por
      # defecto, asi que cualquier integrante que tenga PostgreSQL instalado en
      # Windows ya lo tiene ocupado por el servicio nativo. Cuando eso pasa,
      # Docker solo consigue enlazar el 5432 en IPv6, `localhost` resuelve
      # primero por IPv4 y Prisma termina hablando con el PostgreSQL de la
      # maquina en vez de con este: falla con "Authentication failed" contra
      # una base que no es la del proyecto, y el motivo no es nada evidente.
      #
      # Con el 5433 la base del proyecto no choca con la de nadie. Si igual lo
      # tenes ocupado, cambia solo el numero de la izquierda y actualiza el
      # puerto de tu DATABASE_URL.
      - "5433:5432"
    volumes:
      - verifarm-datos:/var/lib/postgresql/data
    healthcheck:
      # Permite saber si la base ya acepta conexiones, en vez de suponerlo.
      test: ["CMD-SHELL", "pg_isready -U verifarm -d verifarm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  verifarm-datos:
